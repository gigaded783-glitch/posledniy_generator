<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Последний генератор</title><style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#e8f0e8;font:16px system-ui;text-align:center}main{max-width:900px;margin:auto;padding:14px}h1{color:#b9e769;font-size:clamp(20px,4vw,30px)}canvas{width:100%;height:auto;image-rendering:pixelated;border:3px solid #52656a;border-radius:8px;background:#17242a}.bar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px}.pill{background:#1d2b32;padding:8px 12px;border-radius:8px}button{padding:11px 16px;border:0;border-radius:9px;background:#b9e769;font-weight:bold}.pad{display:grid;grid-template-columns:repeat(3,50px);gap:5px;justify-content:center;margin:12px}.pad button{background:#263941;color:white}.pad button:first-child{grid-column:2}.hint{color:#bdc9c8;font-size:14px}.overlay{position:fixed;inset:0;background:#071016e8;display:grid;place-items:center;padding:20px}.card{max-width:440px;background:#1b2b32;border:1px solid #61777b;border-radius:14px;padding:22px}.card h2{color:#b9e769}</style></head><body><main><h1>ПОСЛЕДНИЙ ГЕНЕРАТОР</h1><div class="bar"><span class="pill" id="parts">Детали: 0/6</span><span class="pill" id="power">Энергия: 0%</span><span class="pill" id="pad">Геймпад: проверка…</span></div><canvas id="game" width="640" height="384"></canvas><p class="hint">Стик / крестовина — движение · A или крестик — взаимодействие · E — взаимодействие</p><div class="pad"><button data-k="ArrowUp">▲</button><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button></div><button id="restart">Начать заново</button></main><div class="overlay" id="intro"><div class="card"><h2>Станция «Полюс-7»</h2><p>Найди 6 деталей, избегай неисправных дронов и запусти генератор.</p><button id="start">Войти на станцию</button></div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),T=32,W=20,H=12;
const map=["####################","#....#.......#.....#","#....#.......#.....#","#.................##","###.####..####.....#","#...#.......#......#","#...#.......#..##..#","#...........#......#","#..####..####......#","#..................#","#....#.............#","####################"];
let player,items,drones,keys={},running=false,won=false,energy=0,msg="Собери 6 деталей",msgTime=0,interactLatch=false;
function reset(){player={x:2.5,y:3.5};items=[[7,1],[14,2],[17,5],[3,7],[9,9],[16,10]].map(([x,y])=>({x,y,got:false}));drones=[{x:10.5,y:3.5,dx:1,dy:0,t:0},{x:15.5,y:8.5,dx:0,dy:1,t:0}];energy=0;won=false;msg="Собери 6 деталей";msgTime=150;running=true;draw()}
function say(s){msg=s;msgTime=130}
function wall(x,y){return y<0||y>=H||x<0||x>=W||map[y][x]==="#"}
function interact(){if(!running||won)return;if(Math.hypot(player.x-2.5,player.y-2.5)<1.35){if(items.every(i=>i.got)){energy=100;won=true;say("ГЕНЕРАТОР ЗАПУЩЕН!");}else say("Не хватает деталей: "+items.filter(i=>!i.got).length);return}let a=items.find(i=>!i.got&&Math.hypot(player.x-i.x-.5,player.y-i.y-.5)<.9);if(a){a.got=true;say("Деталь найдена!")}else say("Здесь нечего активировать")}
function gamepad(){let g=Array.from(navigator.getGamepads?navigator.getGamepads():[]).find(x=>x&&x.connected);document.getElementById('pad').textContent=g?"Геймпад: подключён":"Геймпад: не подключён";if(!g)return{x:0,y:0,a:false};let x=Math.abs(g.axes[0]||0)>.25?Math.sign(g.axes[0]):0,y=Math.abs(g.axes[1]||0)>.25?Math.sign(g.axes[1]):0;if(g.buttons[14]?.pressed)x=-1;if(g.buttons[15]?.pressed)x=1;if(g.buttons[12]?.pressed)y=-1;if(g.buttons[13]?.pressed)y=1;return{x,y,a:!!(g.buttons[0]?.pressed||g.buttons[1]?.pressed)}}
function update(){if(!running||won)return;let g=gamepad(),dx=g.x,dy=g.y;if(keys.ArrowLeft||keys.a)dx--;if(keys.ArrowRight||keys.d)dx++;if(keys.ArrowUp||keys.w)dy--;if(keys.ArrowDown||keys.s)dy++;let n=Math.hypot(dx,dy)||1;dx=dx/n*.075;dy=dy/n*.075;let nx=player.x+dx,ny=player.y+dy;if(!wall(Math.floor(nx),Math.floor(player.y)))player.x=nx;if(!wall(Math.floor(player.x),Math.floor(ny)))player.y=ny;if(g.a&&!interactLatch)interact();interactLatch=g.a;
for(let d of drones){if(++d.t>38){d.t=0;let tx=d.x+d.dx*.5,ty=d.y+d.dy*.5;if(wall(Math.floor(tx),Math.floor(ty)))[d.dx,d.dy]=[-d.dy,d.dx];else{d.x=tx;d.y=ty}}if(Math.hypot(player.x-d.x,player.y-d.y)<.55){player.x=2.5;player.y=3.5;say("Дрон поймал тебя. Возвращение ко входу.")}}}
function draw(){ctx.clearRect(0,0,640,384);for(let y=0;y<H;y++)for(let x=0;x<W;x++){ctx.fillStyle=map[y][x]==="#"?"#34434a":"#202f35";ctx.fillRect(x*T,y*T,T,T);ctx.strokeStyle="#293a40";ctx.strokeRect(x*T,y*T,T,T)}ctx.fillStyle="#b9e769";ctx.fillRect(2*T+6,2*T+6,20,20);ctx.fillStyle="#17251b";ctx.fillRect(2*T+12,2*T+10,8,12);for(let a of items)if(!a.got){ctx.fillStyle="#e7bd62";ctx.fillRect(a.x*T+10,a.y*T+10,12,12)}for(let d of drones){ctx.fillStyle="#e36b62";ctx.fillRect(d.x*T-8,d.y*T-8,16,16)}ctx.fillStyle="#79c8ef";ctx.fillRect(player.x*T-8,player.y*T-11,16,22);document.getElementById('parts').textContent="Детали: "+items.filter(a=>a.got).length+"/6";document.getElementById('power').textContent="Энергия: "+energy+"%";if(msgTime>0){ctx.fillStyle="#0b151ddd";ctx.fillRect(120,348,400,28);ctx.fillStyle="#fff";ctx.font="14px system-ui";ctx.textAlign="center";ctx.fillText(msg,320,367);msgTime--}}
function loop(){update();draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>keys[k]=false))});
document.getElementById('start').onclick=()=>{document.getElementById('intro').style.display='none';reset()};document.getElementById('restart').onclick=reset;addEventListener('gamepadconnected',()=>say("Геймпад подключён"));reset();running=false;loop();
</script></main></body></html>
